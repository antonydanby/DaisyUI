<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512">

  <defs>

    <!-- ================================================== -->
    <!-- PETAL COLOURS                                     -->
    <!-- ================================================== -->

    <linearGradient id="petalFill"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dce5ef"/>
    </linearGradient>

    <linearGradient id="petalStroke"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%"   stop-color="#afbed0"/>
      <stop offset="100%" stop-color="#71869f"/>
    </linearGradient>


    <!-- ================================================== -->
    <!-- INTERNAL PETAL SHADING                             -->
    <!-- ================================================== -->

    <!--
      Darkened internal shading.
      The visible shaded area now extends further towards
      the tip before fading smoothly to transparent.
    -->
    <linearGradient id="petalShade"
                    x1="0" y1="1"
                    x2="0" y2="0">

      <stop offset="0%"
            stop-color="#aebfce"
            stop-opacity="0.42"/>

      <stop offset="35%"
            stop-color="#bdcbd9"
            stop-opacity="0.36"/>

      <stop offset="65%"
            stop-color="#c8d5e0"
            stop-opacity="0.28"/>

      <stop offset="78%"
            stop-color="#d3dee8"
            stop-opacity="0.18"/>

      <stop offset="88%"
            stop-color="#e5ecf3"
            stop-opacity="0.07"/>

      <!-- Fully transparent before the rounded end -->
      <stop offset="96%"
            stop-color="#ffffff"
            stop-opacity="0"/>

      <stop offset="100%"
            stop-color="#ffffff"
            stop-opacity="0"/>

    </linearGradient>


    <!-- ================================================== -->
    <!-- SUBTLE PETAL CREASE                               -->
    <!-- ================================================== -->

    <linearGradient id="creaseStroke"
                    x1="0" y1="0"
                    x2="0" y2="1">

      <stop offset="0%"
            stop-color="#aebdcd"
            stop-opacity="0.08"/>

      <stop offset="35%"
            stop-color="#a5b5c6"
            stop-opacity="0.20"/>

      <stop offset="70%"
            stop-color="#94a7ba"
            stop-opacity="0.18"/>

      <stop offset="100%"
            stop-color="#94a7ba"
            stop-opacity="0.02"/>

    </linearGradient>


    <!-- ================================================== -->
    <!-- FLOWER CENTRE                                     -->
    <!-- ================================================== -->

    <radialGradient id="centreFill"
                    cx="35%"
                    cy="25%"
                    r="75%">

      <stop offset="0%"   stop-color="#fff04a"/>
      <stop offset="45%"  stop-color="#ffc900"/>
      <stop offset="75%"  stop-color="#ffad00"/>
      <stop offset="100%" stop-color="#ff8900"/>

    </radialGradient>


    <!-- ================================================== -->
    <!-- SHADOWS                                           -->
    <!-- ================================================== -->

    <filter id="petalShadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">

      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="4"
        flood-color="#50647c"
        flood-opacity="0.16"/>

    </filter>

    <filter id="centreShadow"
            x="-25%"
            y="-25%"
            width="150%"
            height="150%">

      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="5"
        flood-color="#c96d00"
        flood-opacity="0.25"/>

    </filter>


    <!-- ================================================== -->
    <!-- MAIN PETAL                                        -->
    <!-- ================================================== -->

    <path
      id="petal"
      d="
        M 256 250

        C 236 231,
          210 210,
          194 178

        C 177 143,
          178 104,
          194 72

        C 210 42,
          232 25,
          256 25

        C 280 25,
          302 42,
          318 72

        C 334 104,
          335 143,
          318 178

        C 302 210,
          276 231,
          256 250

        Z
      "/>


    <!-- ================================================== -->
    <!-- INTERNAL SHADE                                    -->
    <!-- ================================================== -->

    <path
      id="petalInnerShade"
      d="
        M 258 239

        C 269 223,
          282 204,
          291 183

        C 301 159,
          305 132,
          301 106

        C 297 86,
          287 69,
          274 57

        C 270 53,
          265 50,
          260 48

        L 258 239

        Z
      "/>


    <!-- ================================================== -->
    <!-- PETAL CREASE                                      -->
    <!-- ================================================== -->

    <path
      id="petalCrease"
      d="
        M 256 52
        C 255.5 82,
          256.5 119,
          256 160
      "/>

  </defs>


  <!-- ================================================== -->
  <!-- PETALS                                             -->
  <!-- ================================================== -->

  <g filter="url(#petalShadow)">

    <!-- NORTH -->
    <g>
      <use href="#petal"
           fill="url(#petalFill)"/>
      <use href="#petalInnerShade"
           fill="url(#petalShade)"/>
      <use href="#petalCrease"
           fill="none"
           stroke="url(#creaseStroke)"
           stroke-width="1.25"
           stroke-linecap="round"/>
      <use href="#petal"
           fill="none"
           stroke="url(#petalStroke)"
           stroke-width="7"/>
    </g>


    <!-- NORTH EAST -->
    <g transform="rotate(45 256 256)">
      <use href="#petal"
           fill="url(#petalFill)"/>
      <use href="#petalInnerShade"
           fill="url(#petalShade)"/>
      <use href="#petalCrease"
           fill="none"
           stroke="url(#creaseStroke)"
           stroke-width="1.25"
           stroke-linecap="round"/>
      <use href="#petal"
           fill="none"
           stroke="url(#petalStroke)"
           stroke-width="7"/>
    </g>


    <!-- EAST -->
    <g transform="rotate(90 256 256)">
      <use href="#petal"
           fill="url(#petalFill)"/>
      <use href="#petalInnerShade"
           fill="url(#petalShade)"/>
      <use href="#petalCrease"
           fill="none"
           stroke="url(#creaseStroke)"
           stroke-width="1.25"
           stroke-linecap="round"/>
      <use href="#petal"
           fill="none"
           stroke="url(#petalStroke)"
           stroke-width="7"/>
    </g>


    <!-- SOUTH EAST -->
    <g transform="rotate(135 256 256)">
      <use href="#petal"
           fill="url(#petalFill)"/>
      <use href="#petalInnerShade"
           fill="url(#petalShade)"/>
      <use href="#petalCrease"
           fill="none"
           stroke="url(#creaseStroke)"
           stroke-width="1.25"
           stroke-linecap="round"/>
      <use href="#petal"
           fill="none"
           stroke="url(#petalStroke)"
           stroke-width="7"/>
    </g>


    <!-- SOUTH -->
    <g transform="rotate(180 256 256)">
      <use href="#petal"
           fill="url(#petalFill)"/>
      <use href="#petalInnerShade"
           fill="url(#petalShade)"/>
      <use href="#petalCrease"
           fill="none"
           stroke="url(#creaseStroke)"
           stroke-width="1.25"
           stroke-linecap="round"/>
      <use href="#petal"
           fill="none"
           stroke="url(#petalStroke)"
           stroke-width="7"/>
    </g>


    <!-- SOUTH WEST -->
    <g transform="rotate(225 256 256)">
      <use href="#petal"
           fill="url(#petalFill)"/>
      <use href="#petalInnerShade"
           fill="url(#petalShade)"/>
      <use href="#petalCrease"
           fill="none"
           stroke="url(#creaseStroke)"
           stroke-width="1.25"
           stroke-linecap="round"/>
      <use href="#petal"
           fill="none"
           stroke="url(#petalStroke)"
           stroke-width="7"/>
    </g>


    <!-- WEST -->
    <g transform="rotate(270 256 256)">
      <use href="#petal"
           fill="url(#petalFill)"/>
      <use href="#petalInnerShade"
           fill="url(#petalShade)"/>
      <use href="#petalCrease"
           fill="none"
           stroke="url(#creaseStroke)"
           stroke-width="1.25"
           stroke-linecap="round"/>
      <use href="#petal"
           fill="none"
           stroke="url(#petalStroke)"
           stroke-width="7"/>
    </g>


    <!-- NORTH WEST -->
    <g transform="rotate(315 256 256)">
      <use href="#petal"
           fill="url(#petalFill)"/>
      <use href="#petalInnerShade"
           fill="url(#petalShade)"/>
      <use href="#petalCrease"
           fill="none"
           stroke="url(#creaseStroke)"
           stroke-width="1.25"
           stroke-linecap="round"/>
      <use href="#petal"
           fill="none"
           stroke="url(#petalStroke)"
           stroke-width="7"/>
    </g>

  </g>


  <!-- ================================================== -->
  <!-- CENTRE                                             -->
  <!-- ================================================== -->

  <circle
    cx="256"
    cy="256"
    r="78"
    fill="url(#centreFill)"
    filter="url(#centreShadow)"/>


  <!-- ================================================== -->
  <!-- CENTRE HIGHLIGHT                                   -->
  <!-- ================================================== -->

  <ellipse
    cx="226"
    cy="218"
    rx="27"
    ry="11"
    fill="#ffffff"
    opacity="0.60"
    transform="rotate(-45 226 218)"/>

</svg>